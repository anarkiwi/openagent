name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile.ollama, Dockerfile.opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x

  hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/hosts.sh

  hooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hooks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: pip install black pytest pytest-xdist pytest-cov pylint pygments
      - run: black --check .
      - run: pylint ./*.py
      - run: >-
          pytest -n auto --cov=min_comments --cov=format_check --cov=commits
          --cov=durable_comments --cov=worktree_guard --cov-fail-under=85
      - run: >-
          node --test --experimental-test-coverage --test-coverage-lines=85
          --test-coverage-include=guards.js guards.test.js
        env:
          OPENAGENT_GUARD_PYTHON: python3

  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pygments
      # The commit guard, run over the tracked tree: a stale comment anywhere in
      # the repo fails the job.
      - run: python3 hooks/durable_comments.py $(git ls-files)

  e2e:
    runs-on: ubuntu-latest
    # A cold start already fills most of the budget, and a retried step costs
    # another full session; headroom keeps the failure path short enough to
    # finish capturing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: test/e2e.sh
        continue-on-error: true
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            test/out/*.log
            test/out/server-tmp
      # The step timings and any "ok on retry" line are the flake record.
      - if: always()
        run: cat test/out/diagnostics.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - if: failure()
        run: |
          echo "--- docker info ---"
          docker info || true
          echo "--- docker system df ---"
          docker system df || true
          echo "--- disk space ---"
          df -h || true
          echo "--- running containers ---"
          docker ps -a --filter "network=openagent-e2e" || true
          echo "--- memory ---"
          free -m || true
          echo "--- kernel ring ---"
          dmesg 2>/dev/null | tail -n 50 || true
          exit 1
